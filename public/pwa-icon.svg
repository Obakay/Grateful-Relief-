<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Protective Shield Crest -->
  <path d="M 256 70 L 390 125 C 390 270 330 375 256 425 C 182 375 122 270 122 125 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Nigerian Naira / Growth Arch Symbol -->
  <!-- Left laurel/growth arc -->
  <path d="M 180 280 C 180 340 220 375 256 390 C 292 375 332 340 332 280" 
        fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/>

  <!-- Centered GRP Monogram / Microfinance emblem -->
  <!-- Naira symbol N with double bars -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- N vertical lines -->
    <line x1="205" y1="180" x2="205" y2="295" />
    <line x1="307" y1="180" x2="307" y2="295" />
    <!-- Diagonal -->
    <line x1="205" y1="180" x2="307" y2="295" />
    <!-- Double currency crossbars -->
    <line x1="185" y1="225" x2="327" y2="225" stroke-width="10" />
    <line x1="185" y1="250" x2="327" y2="250" stroke-width="10" />
  </g>

  <!-- Star of Trust at Crest Peak -->
  <polygon points="256,120 262,138 280,138 266,149 271,166 256,155 241,166 246,149 232,138 250,138" fill="url(#goldGrad)"/>

  <!-- Typography at bottom badge -->
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" 
        font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="7">GRATEFUL RELIEF</text>
</svg>
